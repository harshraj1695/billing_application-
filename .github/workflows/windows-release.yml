name: Build Windows application

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Verify source syntax
        run: python -m py_compile app.py custom_generators.py

      - name: Package one-file executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name LalitaAndSonsBilling
          --add-data "assets;assets"
          --add-data "images;images"
          --add-data "Database;Database"
          --add-data "config.json;."
          --collect-all barcode
          app.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = 'dist/LalitaAndSonsBilling.exe'
          if (-not (Test-Path $exe)) { throw "Build output was not created: $exe" }
          Get-Item $exe | Format-List Name,Length

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: LalitaAndSonsBilling-windows
          path: dist/LalitaAndSonsBilling.exe
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LalitaAndSonsBilling.exe
